  <script>
    /* Motion setup (see motion.js). Runs before first paint so animated content starts hidden;

    (function (c) {
      if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
      c.add("motion");
      try { if (!sessionStorage.getItem("pwrd-intro")) c.add("intro"); } catch (e) {}
      setTimeout(function () { if (!window.pwrdMotion) c.remove("motion", "intro", "intro-mounted"); }, 3500);
    })(document.documentElement.classList);
  </script>
